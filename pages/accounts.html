  <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinic | Accounts</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages/accounts.css" />
  </head>
  <body class="p-8 h-screen d-flex flex-row bg-light gap-4">
    <aside class="w-384 h-100 d-flex flex-column justify-between border border-light-gray rounded-md bg-warning">
      <div class="p-3 d-flex flex-column items-center gap-2">
        <img class="w-auto h-96" src="../assets/images/logo/britech-logo.png" alt="" />
        <h1 class="text-center">Clinic Information</h1>
        <h1 class="text-center">And Services System</h1>
      </div>

      <nav class="p-3 d-flex flex-column flex-1">
        <a class="btn-ghost btn-nav" href="./dashboard.html"> <span class="mr-1 fa-solid fa-shapes"></span>Dashboard</a>
        <a class="btn-ghost btn-nav" href="./students.html"> <span class="mr-1 fa-solid fa-users"></span>Students</a>
        <div class="d-flex flex-column">
          <a id="schoolToggle" href="./school/section.html" class="btn-ghost btn-nav__sub-item">
            <div>
              <span class="mr-1 fa-solid fa-school"></span>
              School
            </div>

            <i id="schoolChevron" class="fa-solid fa-chevron-down"></i>
          </a>

          <div id="schoolMenu" class="d-none flex-column">
            <a class="ml-12 btn-ghost btn-nav" href="./school/school-year.html">School Year</a>
            <a class="ml-12 btn-ghost btn-nav" href="./school/strand.html">Grade & Strand</a>
            <a class="ml-12 btn-ghost btn-nav" href="./school/section.html">Sections</a>
          </div>
        </div>

        <a class="btn-ghost btn-ghost__is-active btn-nav" href="./accounts.html">
          <span class="mr-1 fa-solid fa-user-gear"></span> Accounts</a
        >
        <a class="btn-ghost btn-nav" href="./clinic-visits.html">
          <span class="mr-1 fa-solid fa-door-open"></span>Clinic Visits</a
        >
        <a class="btn-ghost btn-nav" href="./health-records.html">
          <span class="mr-1 fa-solid fa-file-medical"></span>Health Records</a
        >
        <a class="btn-ghost btn-nav" href="./medical-items.html">
          <span class="mr-1 fa-solid fa-pills"></span>Medical Items</a
        >
        <a class="btn-ghost btn-nav" href="./symptoms.html">
          <span class="mr-1 fa-solid fa-mask-face"></span>Symptoms</a
        >
        <a class="btn-ghost btn-nav" href="./health-facilities.html">
          <span class="mr-1 fa-solid fa-phone"></span>Health Facilities</a
        >
      </nav>

      <div class="w-100 h-128 aside__illustration-box"></div>
    </aside>

    <div class="w-100 d-flex flex-column gap-4">
      <header
        class="px-5 header__h-13 d-flex flex-row items-center justify-between bg-white border border-light-gray rounded-md"
      >
        <h3 class="text-2xl">Accounts</h3>

        <form class="w-320 bg-light border border-light-gray d-flex flex-row rounded-md" action="">
          <input class="input" type="text" name="search" id="search" placeholder="Search account..." />
          <button class="btn-ghost"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
      </header>

      <main class="d-flex flex-row justify-between gap-4 main-container__h-87 overflow-hidden">
        <section class="w-75 d-flex flex-column gap-4">
          <article class="p-3 h-25 d-flex flex-column gap-3 bg-white border border-light-gray rounded-md overflow-y">
            <div class="d-flex flex-row justify-between gap-3">
              <button class="w-1/3 btn-tertiary">Role List</button>
              <button class="w-1/3 btn-tertiary btn-tertiary__is-active">Add Role</button>
              <button class="w-1/3 btn-tertiary" disabled>Update Role</button>
            </div>

            <form id="add-role-form" class="d-flex flex-column gap-3" action="">
              <div>
                <label class="label" for="role">Add Role</label>
                <input class="mt-1 input" type="text" name="role" id="role" placeholder="Enter role" />
              </div>

              <div>
                <label class="label" for="description">Description</label>
                <textarea
                  class="mt-1 textarea"
                  name="description"
                  id="description"
                  placeholder="Describe this role..."
                ></textarea>
              </div>

              <div class="d-flex justify-end">
                <button class="btn-primary"><i class="fa-solid fa-plus"></i>Add Role</button>
              </div>
            </form>

            <form id="update-role-form" class="d-none flex-column gap-3" action="">
              <div>
                <label class="label" for="update-role">Update Role</label>
                <input class="mt-1 input" type="text" name="update-role" id="update-role" placeholder="Enter role" />
              </div>

              <div>
                <label class="label" for="update-description">Description</label>
                <textarea
                  class="mt-1 textarea"
                  name="update-description"
                  id="update-description"
                  placeholder="Describe this role..."
                ></textarea>
              </div>

              <div class="d-flex justify-end">
                <button class="btn-primary"><i class="fa-solid fa-pen"></i>Update Role</button>
              </div>
            </form>
          </article>

          <!-- Table container -->
          <article class="h-75 bg-white border border-light-gray rounded-md overflow-hidden">
            <div class="table-wrapper">
              <table class="table">
                <thead>
                  <tr>
                    <th>Lastname</th>
                    <th>Firstname</th>
                    <th>Username</th>
                    <th>Password</th>
                    <th>Role</th>
                    <th>Contact No.</th>
                    <th>Email</th>
                  </tr>
                </thead>

                <tbody>
                  <tr></tr>
                </tbody>
              </table>
            </div>
          </article>
        </section>

        <!-- Left container -->
        <aside class="p-3 w-25 bg-white border border-light-gray rounded-md overflow-hidden">
          <form class="pb-24 h-100 d-flex flex-column gap-3 overflow-y" action="">
            <h1>Add Accounts</h1>

            <div>
              <label class="label" for="username">Username</label>
              <input class="mt-1 input" type="text" name="username" id="username" placeholder="Enter username" />
            </div>

            <div>
              <label class="label" for="firstname">Password</label>
              <input class="mt-1 input" type="password" name="password" id="password" placeholder="Enter password" />
            </div>

            <div>
              <label class="label" for="lastname">Lastname</label>
              <input class="mt-1 input" type="lastname" name="lastname" id="lastname" placeholder="Enter lastname" />
            </div>

            <div>
              <label class="label" for="firstname">Firstname</label>
              <input
                class="mt-1 input"
                type="firstname"
                name="firstname"
                id="firstname"
                placeholder="Enter firstname"
              />
            </div>

            <div>
              <label class="label" for="contact-no">Contact No.</label>
              <input
                class="mt-1 input"
                type="contact-no"
                name="contact-no"
                id="contact-no"
                placeholder="Enter contact no."
              />
            </div>

            <div>
              <label class="label" for="email">Email</label>
              <input class="mt-1 input" type="email" name="email" id="email" placeholder="Enter email" />
            </div>
          </form>

          <div class="position-sticky bottom-0 bg-white">
            <button class="w-100 btn-primary">Add Account</button>
          </div>
        </aside>
      </main>
    </div>
  </body>

  <script type="module" src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/pages/accounts.js"></script>
</html>
