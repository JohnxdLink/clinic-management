<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinic | Medical Items</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages/medical-items.css" />
  </head>
  <body class="p-8 h-screen d-flex flex-row bg-light gap-4">
    <aside class="w-384 h-100 d-flex flex-column justify-between border border-light-gray rounded-md bg-warning">
      <div class="p-3 d-flex flex-column items-center gap-2">
        <img class="w-auto h-96" src="../assets/images/logo/britech-logo.png" alt="" />
        <h1 class="text-center">Clinic Information</h1>
        <h1 class="text-center">And Services System</h1>
      </div>

      <nav class="p-3 d-flex flex-column flex-1">
        <a class="btn-ghost btn-nav" href="./dashboard.html"> <span class="mr-1 fa-solid fa-shapes"></span>Dashboard</a>
        <a class="btn-ghost btn-nav" href="./students.html"> <span class="mr-1 fa-solid fa-users"></span>Students</a>
        <div class="d-flex flex-column">
          <a id="schoolToggle" href="./school/section.html" class="btn-ghost btn-nav__sub-item">
            <div>
              <span class="mr-1 fa-solid fa-school"></span>
              School
            </div>

            <i id="schoolChevron" class="fa-solid fa-chevron-down"></i>
          </a>

          <div id="schoolMenu" class="d-none flex-column">
            <a class="ml-12 btn-ghost btn-nav" href="./school/school-year.html">School Year</a>
            <a class="ml-12 btn-ghost btn-nav" href="./school/strand.html">Grade & Strand</a>
            <a class="ml-12 btn-ghost btn-nav" href="./school/section.html">Sections</a>
          </div>
        </div>

        <a class="btn-ghost btn-nav" href="./accounts.html">
          <span class="mr-1 fa-solid fa-user-gear"></span> Accounts</a
        >
        <a class="btn-ghost btn-nav" href="./clinic-visits.html">
          <span class="mr-1 fa-solid fa-door-open"></span>Clinic Visits</a
        >
        <a class="btn-ghost btn-nav" href="./health-records.html">
          <span class="mr-1 fa-solid fa-file-medical"></span>Health Records</a
        >
        <a class="btn-ghost btn-ghost__is-active btn-nav" href="./medical-items.html">
          <span class="mr-1 fa-solid fa-pills"></span>Medical Items</a
        >
        <a class="btn-ghost btn-nav" href="./symptoms.html">
          <span class="mr-1 fa-solid fa-mask-face"></span>Symptoms</a
        >
        <a class="btn-ghost btn-nav" href="./health-facilities.html">
          <span class="mr-1 fa-solid fa-phone"></span>Health Facilities</a
        >
      </nav>

      <div class="w-100 h-128 aside__illustration-box"></div>
    </aside>

    <div class="w-100 d-flex flex-column gap-4">
      <header class="header__h-13 border border-light-gray rounded-md">
        <h3 class="p-3 text-lg">
          Medical Item
        </h3>
      </header>

      <main class="p-5 main-container__h-87 d-flex flex-row gap-5 border border-light-gray rounded-md">
        <div class="p-5 w-100 border border-light-gray rounded-md">
          <div class="table-wrapper">
            <table class="table">
              <thead>
                <th>Item name</th>
                <th>Category</th>
                <th>Unit</th>
                <th>Quantity</th>
                <th>Reorder level</th>
                <th>Expiration date</th>
                <th>Status</th>
              </thead>
            </table>
          </div>
        </div>

        <aside class="w-1/3">
          <form class="d-flex flex-column gap-3" action="">
            <h1 class="m-0">Medical Items</h1>

            <div class="d-flex flex-column gap-2">
              <label class="label" for="item_name">Item Name:</label>
              <input class="input" type="text" id="item_name" name="item_name" required />
            </div>

            <div class="d-flex flex-column gap-2">
              <label class="label" for="category">Category:</label>
              <input class="input" type="text" id="category" name="category" required />
            </div>

            <div class="d-flex flex-column gap-2">
              <label class="label" for="unit">Unit:</label>
              <input class="input" type="text" id="unit" name="unit" required />
            </div>

            <div class="d-flex flex-column gap-2">
              <label class="label" for="quantity">Quantity:</label>
              <input class="input" type="number" id="quantity" name="quantity" min="0" required />
            </div>

            <div class="d-flex flex-column gap-2">
              <label class="label" for="reorder_level">Reorder Level:</label>
              <input class="input" type="number" id="reorder_level" name="reorder_level" min="0" required />
            </div>

            <div class="d-flex flex-column gap-2">
              <label class="label" for="expiration_date">Expiration Date:</label>
              <input class="input" type="date" id="expiration_date" name="expiration_date" required />
            </div>

            <div class="d-flex flex-column gap-2">
              <label class="label" for="status">Status:</label>
              <select class="select" id="status" name="status" required>
                <option value="">Select Status</option>
                <option value="Available">Available</option>
                <option value="Low Stock">Low Stock</option>
                <option value="Out of Stock">Out of Stock</option>
                <option value="Expired">Expired</option>
              </select>
            </div>

            <div class="d-flex flex-row gap-2">
              <button class="btn-primary w-1/2" type="submit">Save Medical Item</button>
              <button class="btn-tertiary w-1/2" type="reset">Clear Form</button>
            </div>
          </form>
        </aside>
      </main>
    </div>
  </body>

  <script type="module" src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/pages/medical_items.js"></script>
</html>
