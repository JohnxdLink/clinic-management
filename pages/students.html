<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinic | Students</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages/students.css" />
  </head>
  <body class="p-8 h-screen d-flex flex-row bg-light gap-4">
    <aside class="w-384 h-100 d-flex flex-column justify-between border border-light-gray rounded-md bg-warning">
      <div class="p-3 d-flex flex-column items-center gap-2">
        <img class="w-auto h-96" src="../assets/images/logo/britech-logo.png" alt="" />
        <h1 class="text-center">Clinic Information</h1>
        <h1 class="text-center">And Services System</h1>
      </div>

      <nav class="p-3 d-flex flex-column flex-1">
        <a class="btn-ghost btn-nav" href="./dashboard.html"> <span class="mr-1 fa-solid fa-shapes"></span>Dashboard</a>
        <a class="btn-ghost btn-ghost__is-active btn-nav" href="./students.html">
          <span class="mr-1 fa-solid fa-users"></span>Students</a
        >
        <div class="d-flex flex-column">
          <a id="schoolToggle" href="./school/section.html" class="btn-ghost btn-nav__sub-item">
            <div>
              <span class="mr-1 fa-solid fa-school"></span>
              School
            </div>

            <i id="schoolChevron" class="fa-solid fa-chevron-down"></i>
          </a>

          <div id="schoolMenu" class="d-none flex-column">
            <a class="ml-12 btn-ghost btn-nav" href="./school/school-year.html">School Year</a>
            <a class="ml-12 btn-ghost btn-nav" href="./school/strand.html">Grade & Strand</a>
            <a class="ml-12 btn-ghost btn-nav" href="./school/section.html">Sections</a>
          </div>
        </div>

        <a class="btn-ghost btn-nav" href="./accounts.html">
          <span class="mr-1 fa-solid fa-user-gear"></span> Accounts</a
        >
        <a class="btn-ghost btn-nav" href="./clinic-visits.html">
          <span class="mr-1 fa-solid fa-door-open"></span>Clinic Visits</a
        >
        <a class="btn-ghost btn-nav" href="./health-records.html">
          <span class="mr-1 fa-solid fa-file-medical"></span>Health Records</a
        >
        <a class="btn-ghost btn-nav" href="./medical-items.html">
          <span class="mr-1 fa-solid fa-pills"></span>Medical Items</a
        >
        <a class="btn-ghost btn-nav" href="./symptoms.html">
          <span class="mr-1 fa-solid fa-mask-face"></span>Symptoms</a
        >
        <a class="btn-ghost btn-nav" href="./health-facilities.html">
          <span class="mr-1 fa-solid fa-phone"></span>Health Facilities</a
        >
      </nav>

      <div class="w-100 h-128 aside__illustration-box"></div>
    </aside>

    <div class="w-100 d-flex flex-column gap-4">
      <header class="header__h-13 border border-light-gray rounded-md text-lg text-bold">
        <i class="fa-solid fa-bars p-5"></i>Student
      </header>

      <main class="p-5 main-container__h-87 d-flex flex-row gap-5 border border-light-gray rounded-md">
        <div class="w-100 bg-white border border-light-gray rounded-md overflow-hidden">
          <div class="table-wrapper">
            <table class="table">
              <thead>
                <th class="">Student Id</th>
                <th class="">Name</th>
                <th class="">Grade Level</th>
                <th class="">Status</th>
                <th class="">Actions</th>
              </thead>
            </table>
          </div>
        </div>
        <aside class="w-1/3">
          <form class="d-flex flex-column gap-3" action="">
            <div class="d-flex flex-row items-center gap-4 p-4 border rounded-md">
              <div class="students-icon">
                <i class="fa-solid fa-graduation-cap"></i>
              </div>

              <div class="d-flex flex-column flex-1 gap-1">
                <h2>Students Form</h2>
                <p>Enter student information</p>
              </div>
            </div>

            <div class="form-container d-flex flex-column flex-1 gap-2">
              <label class="label" for="grade_section">Student Id</label>
              <input
                class="input"
                type="text"
                id="student_id"
                name="student_id"
                placeholder="Enter student ID"
                required
              />
            </div>

            <div class="form-container d-flex flex-column flex-1 gap-2">
              <label class="label" for="lastname">Name</label>
              <input class="input" type="text" id="name" name="name" placeholder="Enter name" required />
            </div>

            <div class="form-container d-flex flex-column flex-1 gap-2">
              <label class="label" for="firstname">Grade Level</label>
              <input
                class="input"
                type="text"
                id="grade_level"
                name="grade_level"
                placeholder="Enter Grade Level"
                required
              />
            </div>

            <div class="form-container d-flex flex-column flex-1 gap-2">
              <label class="label" for="middlename">Status</label>
              <input class="input" type="text" id="status" name="status" placeholder="Enter status" />
            </div>

            <div class="students-actions d-flex flex-row gap-3">
              <button type="submit" class="btn-primary w-1/2">Save Student</button>
              <button type="reset" class="btn-tertiary w-1/2">Clear</button>
            </div>
          </form>
        </aside>
      </main>
    </div>
  </body>

  <script type="module" src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/pages/accounts.js"></script>
</html>
